<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>白吟秋</title>
  <meta name="description" content="白吟秋的个人小站：写代码也做视频，这里放一些零零散散的想法。" />
  <!-- 闪屏防护：在 React 挂载前先把主题与边角样式预设到 <html>，避免深色/圆角用户看到闪烁 -->
  <script>(function(){try{var t=localStorage.getItem('hcl-theme');if(t==='light'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.setAttribute('data-theme','light')}if(localStorage.getItem('hcl-corner')==='rounded'){document.documentElement.setAttribute('data-corner','rounded')}}catch(e){}})();</script>
  <link rel="icon" type="image/png" href="%BASE_URL%images/avatar.png?v=3" />
  <meta name="theme-color" content="#0e0e0e" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
